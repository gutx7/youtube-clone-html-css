<!DOCTYPE html>

<html>
    <head>
        <title>Youtube</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>

            p{
                font-family: Roboto , Arial;
                margin: 0;
            }
            .search-box {
                display: block;
            }
            .thumbnail{
                width: 300px;
            }

            .video-auther , .video-stats{
                display: inline-block;
                color: rbg(96 , 96 , 96);
                font-size: 12px;
            }

            .video-preview {
                width: 300px;
                display: inline-block;
                vertical-align: top;
                margin-right: 15px;
            }

            .video-title {
                margin-top: 0px;
                font-size: 14px;
                font-weight: 700;
                line-height: 20px;
                margin-bottom: 12px;
            }

            .channel-picture {
                display: inline-block;
                width: 50px;
                vertical-align: top;
                margin-top: 12px;
            }

            .video-info {
                display: inline-block;
                width: 200px;
                margin-top: 10px;
            }

            .pfp{
                width: 40px;
                border-radius: 50%;
            }

        </style>

    </head>
    <body>
        <input class="search-box" type="text" placeholder="Search" >
        <div class="video-preview">
            <div>
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="pfp" src="channel-pfps/channel-1.jpeg">
                </div>

                <div class="video-info">
                    <p class="video-title">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>
                    <p class="video-auther">
                    Marques Brownlee
                    </p>
                    <p class="video-stats">
                    3.4M views &#183; 6 months ago
                    </p>
                </div>
            </div>
        </div>

        <div class="video-preview">
            <div>
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            </div>
            <div>
                <div class="channel-picture">
                    <img class="pfp" src="channel-pfps/channel-2.jpeg">
                </div>

                <div class="video-info">
                    <p class="video-title">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>
                    <p class="video-auther">
                    Marques Brownlee
                    </p>
                    <p class="video-stats">
                    3.4M views &#183; 6 months ago
                    </p>
                </div>
            </div>
        </div>

    </body>
</html>
